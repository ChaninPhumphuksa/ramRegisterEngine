name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # ให้กดรันเองได้จากหน้า Actions tab ด้วย

jobs:
  build:
    runs-on: windows-latest   # ใช้ runner ที่เป็น Windows จริง จึง build .exe ได้

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name memory_scanner_gui memory_scanner_gui.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory_scanner_gui-windows
          path: dist/memory_scanner_gui.exe
